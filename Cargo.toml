[package]
name = "hermit"
version = "1.2.0"
edition = "2024"
license-file = "UNLICENSE"
homepage = "https://gitlab.com/beavuck-services/hermit"
repository = "https://gitlab.com/beavuck-services/hermit"
readme = "README.md"
description = "OpenAPI mock server -- serve realistic responses from any OpenAPI spec"
keywords = ["openapi", "mock", "mock-server", "cli"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]
include = ["src/**/*", "README.md", "UNLICENSE"]

[dependencies]
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
axum = "0.8"
serde_json = "1.0.149"
yaml_serde = "0.10.4"
clap = { version = "4.6.0", features = ["derive"] }
rand = "0.10.0"
rayon = "1.11.0"
chrono = "0.4.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
criterion = { version = "0.8.2", features = ["html_reports"] }
regex = "1.12.3"

[[bench]]
name = "startup_bench"
harness = false

[[bench]]
name = "generate_bench"
harness = false

[[bench]]
name = "request_bench"
harness = false
