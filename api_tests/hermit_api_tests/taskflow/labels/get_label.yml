info:
  name: get_label
  type: http
  seq: 4

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/labels/{{LABEL_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined
    - expression: res.body.name
      operator: isDefined
    - expression: res.body.color
      operator: isDefined
    - expression: res.body.description
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
