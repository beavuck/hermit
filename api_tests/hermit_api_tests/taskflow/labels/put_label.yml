info:
  name: put_label
  type: http
  seq: 5

http:
  method: PUT
  url: "{{TASKFLOW_BASE_URL}}/labels/{{LABEL_ID}}"
  body:
    type: json
    data: |-
      {
        "name": "{{PUT_LABEL_NAME}}",
        "color": "{{PUT_LABEL_COLOR}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined
    - expression: res.body.description
      operator: isDefined
    - expression: res.body.name
      operator: eq
      value: "{{PUT_LABEL_NAME}}"
    - expression: res.body.color
      operator: eq
      value: "{{PUT_LABEL_COLOR}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
