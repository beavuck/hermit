info:
  name: get_label_after_patch
  type: http
  seq: 7

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/labels/{{LABEL_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.description
      operator: eq
      value: "{{PATCH_LABEL_DESCRIPTION}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
