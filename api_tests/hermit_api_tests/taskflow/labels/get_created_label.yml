info:
  name: get_created_label
  type: http
  seq: 3

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/labels/{{CREATED_LABEL_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{CREATED_LABEL_ID}}"
    - expression: res.body.name
      operator: eq
      value: "{{POST_LABEL_NAME}}"
    - expression: res.body.color
      operator: eq
      value: "{{POST_LABEL_COLOR}}"
    - expression: res.body.description
      operator: eq
      value: "{{POST_LABEL_DESCRIPTION}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
