info:
  name: post_task_feature
  type: http
  seq: 2

http:
  method: POST
  url: "{{TASKFLOW_BASE_URL}}/projects/c9d8e7f6-a5b4-3210-fedc-ba9876543210/tasks"
  headers:
    Content-Type: application/json
  body:
    type: json
    data: |-
      {
        "title": "Implement schema-based response generation",
        "type": "feature",
        "storyPoints": 5
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.title
      operator: isDefined
    - expression: res.body.type
      operator: eq
      value: feature
    - expression: res.body.projectId
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
