info:
  name: post_task_bug
  type: http
  seq: 3

http:
  method: POST
  url: "{{TASKFLOW_BASE_URL}}/projects/c9d8e7f6-a5b4-3210-fedc-ba9876543210/tasks"
  headers:
    Content-Type: application/json
  body:
    type: json
    data: |-
      {
        "title": "Fix allOf resolution panic",
        "type": "bug",
        "severity": "high"
      }
