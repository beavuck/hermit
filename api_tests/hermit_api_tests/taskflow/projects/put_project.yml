info:
  name: put_project
  type: http
  seq: 7

http:
  method: PUT
  url: "{{TASKFLOW_BASE_URL}}/projects/{{PROJECT_ID}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{PUT_PROJECT_NAME}}",
        "description": "{{PUT_PROJECT_DESCRIPTION}}",
        "status": "active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.name
      operator: eq
      value: "{{PUT_PROJECT_NAME}}"
    - expression: res.body.description
      operator: eq
      value: "{{PUT_PROJECT_DESCRIPTION}}"
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined
    - expression: res.body.owner
      operator: isDefined
    - expression: res.body.owner.id
      operator: isDefined
    - expression: res.body.owner.name
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
