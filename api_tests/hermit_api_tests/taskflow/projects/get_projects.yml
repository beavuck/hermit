info:
  name: get_projects
  type: http
  seq: 2

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/projects"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.total
      operator: isDefined
    - expression: res.body.page
      operator: isDefined
    - expression: res.body.limit
      operator: isDefined
    - expression: res.body.items
      operator: isArray
    - expression: res.body.items
      operator: isNotEmpty
    - expression: res.body.items[0].id
      operator: isDefined
    - expression: res.body.items[0].name
      operator: isDefined
    - expression: res.body.items[0].createdAt
      operator: isDefined
    - expression: res.body.items[0].updatedAt
      operator: isDefined
    - expression: res.body.items[0].owner
      operator: isDefined
    - expression: res.body.items[0].owner.id
      operator: isDefined
    - expression: res.body.items[0].owner.name
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
