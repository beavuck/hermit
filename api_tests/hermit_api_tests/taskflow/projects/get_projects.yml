info:
  name: get_projects
  type: http
  seq: 1

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/projects"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
