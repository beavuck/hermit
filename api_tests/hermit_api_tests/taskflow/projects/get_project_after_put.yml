info:
  name: get_project_after_put
  type: http
  seq: 8

http:
  method: GET
  url: "{{TASKFLOW_BASE_URL}}/projects/{{PROJECT_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "{{PUT_PROJECT_NAME}}"
    - expression: res.body.description
      operator: eq
      value: "{{PUT_PROJECT_DESCRIPTION}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
