info:
  name: post_project
  type: http
  seq: 3

http:
  method: POST
  url: "{{TASKFLOW_BASE_URL}}/projects"
  body:
    type: json
    data: |-
      {
        "name": "{{POST_PROJECT_NAME}}",
        "description": "{{POST_PROJECT_DESCRIPTION}}",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("CREATED_PROJECT_ID", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.name
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined
    - expression: res.body.owner
      operator: isDefined
    - expression: res.body.owner.id
      operator: isDefined
    - expression: res.body.owner.name
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
