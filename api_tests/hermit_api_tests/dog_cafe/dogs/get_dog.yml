info:
  name: get_dog
  type: http
  seq: 3

http:
  method: GET
  url: "{{DOG_CAFE_BASE_URL}}/dogs/{{CREATED_DOG_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{CREATED_DOG_ID}}"
    - expression: res.body.name
      operator: eq
      value: "{{POST_DOG_NAME}}"
    - expression: res.body.breed
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
