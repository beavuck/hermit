info:
  name: get_dogs
  type: http
  seq: 1

http:
  method: GET
  url: "{{DOG_CAFE_BASE_URL}}/dogs"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty
    - expression: res.body[0].id
      operator: isDefined
    - expression: res.body[0].name
      operator: isDefined
    - expression: res.body[0].breed
      operator: isDefined
    - expression: res.body[0].size
      operator: isDefined
    - expression: res.body[0].createdAt
      operator: isDefined
    - expression: res.body[0].updatedAt
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
