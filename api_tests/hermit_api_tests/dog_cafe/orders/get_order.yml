info:
  name: get_order
  type: http
  seq: 4

http:
  method: GET
  url: "{{DOG_CAFE_BASE_URL}}/orders/{{CREATED_ORDER_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{CREATED_ORDER_ID}}"
    - expression: res.body.type
      operator: eq
      value: "dine_in"
    - expression: res.body.tableNumber
      operator: isDefined
    - expression: res.body.dogId
      operator: isDefined
    - expression: res.body.createdAt
      operator: isDefined
    - expression: res.body.updatedAt
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
