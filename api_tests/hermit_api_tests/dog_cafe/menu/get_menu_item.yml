info:
  name: get_menu_item
  type: http
  seq: 2

http:
  method: GET
  url: "{{DOG_CAFE_BASE_URL}}/menu/{{MENU_ITEM_ID}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.name
      operator: isDefined
    - expression: res.body.price
      operator: isDefined
    - expression: res.body.category
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
