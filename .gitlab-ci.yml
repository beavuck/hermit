########~~~~-- Stages --~~~~########

stages:
  - secure
  - test
  - upgrade
  - build
  - deploy

########~~~~-- Variables & defaults --~~~~########

variables:
  SCRIPT_TO_INSTALL_DEPS: "apk add --no-cache git bash curl jq && cargo install just"

default:
  image: dhi.io/rust:1-alpine3.23-dev
  interruptible: true

########~~~~-- Workflows --~~~~########

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"

########~~~~-- Includes --~~~~########

include:
  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/secret-finder/secret-finder@main"
    inputs:
      job_name: "find_secrets"
      stage_config: "secure"

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/command-runner/command-runner@main"
    inputs:
      job_name: "format"
      stage_config: ".pre"
      branch_name: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      command: "just lint"
      commit_message: "🎨 Format code automatically"
      image: "rust:alpine"
      script_to_install_deps: "$SCRIPT_TO_INSTALL_DEPS"
      consecutive_command_commits_allowed: false

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/command-runner/command-runner@main"
    inputs:
      job_name: "upgrade"
      stage_config: "upgrade"
      branch_name: "chore/upgrade-dependencies"
      command: "just upgrade-ci"
      commit_message: "⚙️ Upgrade dependencies automatically"
      image: "rust:alpine"
      script_to_install_deps: "$SCRIPT_TO_INSTALL_DEPS"
      consecutive_command_commits_allowed: true

find_secrets:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

format:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

upgrade:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule' && $IS_UPGRADE == 'true'"

########~~~~-- Templates --~~~~########

.cargo_cache:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  before_script:
    - export PATH="$CARGO_HOME/bin:$PATH"

########~~~~-- Jobs --~~~~########

run_unit_tests:
  extends: .cargo_cache
  stage: test
  script:
    - apk add --no-cache llvm
    - export LLVM_COV=$(command -v llvm-cov || ls /usr/bin/llvm-cov-* 2>/dev/null | head -1)
    - export LLVM_PROFDATA=$(command -v llvm-profdata || ls /usr/bin/llvm-profdata-* 2>/dev/null | head -1)
    - cargo install just cargo-llvm-cov
    - just coverage-ci
  artifacts:
    expire_in: 1 day
    paths:
      - lcov.info
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true

analyze:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:latest"
    entrypoint: [ "" ]
  cache:
    key: "${CI_JOB_NAME}"
    paths: [ .sonar/cache ]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task
  script:
    - git config --global --add safe.directory "/builds/$CI_PROJECT_PATH"
    - LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then PROJECT_VERSION=$LATEST_TAG; else PROJECT_VERSION=$LATEST_TAG-$CI_MERGE_REQUEST_ID; fi
    - sonar-scanner -Dsonar.projectVersion=$PROJECT_VERSION
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: run_unit_tests
      optional: true

build_hermit:
  extends: .cargo_cache
  stage: build
  variables:
    RUSTFLAGS: "-C target-feature=+crt-static"
  script:
    - cargo build --release --target x86_64-unknown-linux-musl
  artifacts:
    expire_in: 1 day
    paths:
      - target/x86_64-unknown-linux-musl/release/hermit
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_TAG"
  needs:
    - job: find_secrets
      optional: true
    - job: run_unit_tests
      optional: true

run_performance_tests:
  extends: .cargo_cache
  image: rust:alpine
  stage: test
  script:
    - cargo install just critcmp
    - just bench-ci
    - |
      if [ -d criterion-baseline ]; then
        cp -r criterion-baseline/. target/criterion/
        critcmp main change --threshold 10
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        cp -r target/criterion criterion-baseline
      fi
  cache:
    - key: "cargo-$CI_COMMIT_REF_SLUG"
      paths:
        - .cargo/registry/
        - .cargo/git/
        - target/
    - key: "criterion-baseline"
      paths:
        - criterion-baseline/
  artifacts:
    expire_in: 1 week
    paths:
      - target/criterion/
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: run_unit_tests
      optional: true

run_api_tests:
  stage: build
  image: node:lts-alpine
  script:
    - ./target/x86_64-unknown-linux-musl/release/hermit --specs specs_assets/taskflow.openapi.yml &
    - sleep 1
    - cd api_tests/hermit_api_tests && npx --yes @usebruno/cli run --env hermit_env --bail
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: build_hermit

release_hermit:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: "$CI_COMMIT_TAG"
  needs:
    - job: build_hermit
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file target/x86_64-unknown-linux-musl/release/hermit \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hermit/${CI_COMMIT_TAG}/hermit"
  release:
    name: "$CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Details: https://${CI_SERVER_FQDN}/beavuck-services/hermit/-/network/main?ref_type=heads"
    assets:
      links:
        - name: "linux-executable"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hermit/${CI_COMMIT_TAG}/hermit"
          link_type: package
