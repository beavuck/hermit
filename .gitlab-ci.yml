########~~~~-- Stages --~~~~########

stages:
  - secure
  - test
  - upgrade
  - build
  - deploy

########~~~~-- Variables & defaults --~~~~########

variables:
  SCRIPT_TO_INSTALL_DEPS: "apk add --no-cache git bash curl jq && cargo install just"
  X86_64_LINUX: "x86_64-unknown-linux-musl"
  AARCH64_LINUX: "aarch64-unknown-linux-musl"
  X86_64_WINDOWS: "x86_64-pc-windows-gnu"
  IMAGE: rust:1-alpine3.23

default:
  image: $IMAGE
  interruptible: true

########~~~~-- Workflows --~~~~########

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"

########~~~~-- Includes --~~~~########

include:
  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/secret-finder/secret-finder@main"
    inputs:
      job_name: "find_secrets"
      stage_config: "secure"

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/command-runner/command-runner@main"
    inputs:
      job_name: "upgrade"
      stage_config: "upgrade"
      branch_name: "chore/upgrade-dependencies"
      command: "just upgrade-ci"
      commit_message: "⚙️ Upgrade dependencies automatically"
      image: "$IMAGE"
      script_to_install_deps: "$SCRIPT_TO_INSTALL_DEPS"
      consecutive_command_commits_allowed: true

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/docker-publisher/docker-publisher@main"
    inputs:
      job_name: "publish_to_docker"
      stage_config: "deploy"
      image_name: "beavuck/${CI_PROJECT_NAME}"
      platforms: "linux/amd64,linux/arm64"
      publish_to_dockerhub: true

find_secrets:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

upgrade:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule' && $IS_UPGRADE == 'true'"

publish_to_docker:
  rules:
    - if: "$CI_COMMIT_TAG"
      when: manual

########~~~~-- Templates --~~~~########

.install_glab:
  before_script:
    - |
      GLAB_VERSION=$(curl -fsSL "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases?per_page=1" \
        | grep -o '"tag_name":"[^"]*"' | head -1 | sed 's/.*:"\(.*\)"/\1/')
      curl -fsSL "https://gitlab.com/gitlab-org/cli/-/releases/${GLAB_VERSION}/downloads/glab_${GLAB_VERSION#v}_linux_amd64.tar.gz" \
        -o /tmp/glab.tar.gz
      tar xzf /tmp/glab.tar.gz -C /tmp/
      install -m755 /tmp/bin/glab /usr/local/bin/glab

.cargo_cache:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  before_script:
    - mkdir -p "$CARGO_HOME/bin"
    - export PATH="$CARGO_HOME/bin:$PATH"

########~~~~-- Jobs --~~~~########

run_unit_tests:
  extends: .cargo_cache
  stage: test
  script:
    - apk add --no-cache curl llvm
    - export LLVM_COV=$(command -v llvm-cov || ls /usr/bin/llvm-cov-* 2>/dev/null | head -1)
    - export LLVM_PROFDATA=$(command -v llvm-profdata || ls /usr/bin/llvm-profdata-* 2>/dev/null | head -1)
    - JUST_VERSION=$(curl -LsSf https://api.github.com/repos/casey/just/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
    - curl -LsSf "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xzf - -C "$CARGO_HOME/bin" just
    - curl -LsSf "https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz" | tar -xzf - -C "$CARGO_HOME/bin"
    - curl -LsSf https://get.nexte.st/latest/linux-musl | tar -xzf - -C "$CARGO_HOME/bin"
    - just coverage-ci
  artifacts:
    expire_in: 1 day
    paths:
      - lcov.info
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true

analyze:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:latest"
    entrypoint: [ "" ]
  cache:
    key: "${CI_JOB_NAME}"
    paths: [ .sonar/cache ]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task
  script:
    - git config --global --add safe.directory "/builds/$CI_PROJECT_PATH"
    - LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then PROJECT_VERSION=$LATEST_TAG; else PROJECT_VERSION=$LATEST_TAG-$CI_MERGE_REQUEST_ID; fi
    - sonar-scanner -Dsonar.projectVersion=$PROJECT_VERSION
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: run_unit_tests
      optional: true

build_hermit:
  extends: .cargo_cache
  stage: build
  parallel:
    matrix:
      - ARCH: amd64
        RUST_TARGET: $X86_64_LINUX
        RUSTFLAGS: "-C target-feature=+crt-static"
      - ARCH: arm64
        RUST_TARGET: $AARCH64_LINUX
        RUSTFLAGS: "-C target-feature=+crt-static"
      - ARCH: windows-amd64
        RUST_TARGET: $X86_64_WINDOWS
        RUSTFLAGS: ""
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG-$RUST_TARGET"
    paths:
      - .cargo/
      - target/
  script:
    - apk add --no-cache curl zig
    - JUST_VERSION=$(curl -LsSf https://api.github.com/repos/casey/just/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
    - curl -LsSf "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xzf - -C "$CARGO_HOME/bin" just
    - ZIGBUILD_VERSION=$(curl -LsSf https://api.github.com/repos/rust-cross/cargo-zigbuild/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
    - curl -LsSf "https://github.com/rust-cross/cargo-zigbuild/releases/download/${ZIGBUILD_VERSION}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" | tar -xJf - --strip-components=1 -C "$CARGO_HOME/bin" "cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild"
    - just build-release
  artifacts:
    expire_in: 1 day
    paths:
      - target/$RUST_TARGET/release/hermit*
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_TAG"
  needs:
    - job: find_secrets
      optional: true
    - job: run_unit_tests
      optional: true

run_api_tests:
  stage: build
  image: node:lts-alpine
  script:
    - ./target/$X86_64_LINUX/release/hermit --specs-dir specs_assets &
    - sleep 1
    - cd api_tests/hermit_api_tests && npx --yes @usebruno/cli run --env hermit_env --bail
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: build_hermit
      parallel:
        matrix:
          - ARCH: amd64
            RUST_TARGET: $X86_64_LINUX
            RUSTFLAGS: "-C target-feature=+crt-static"

publish_to_cargo:
  extends: .cargo_cache
  stage: deploy
  script:
    - CARGO_REGISTRY_TOKEN=$CARGO_TOKEN cargo publish
  rules:
    - if: "$CI_COMMIT_TAG"
      when: manual

release_hermit:
  stage: deploy
  image: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/debian:stable-slim"
  rules:
    - if: "$CI_COMMIT_TAG"
  needs:
    - job: publish_to_docker
    - job: publish_to_cargo
    - job: build_hermit
      artifacts: true
  before_script:
    - apt update -y && apt install -y curl git jq
    - !reference [.install_glab, before_script]
  script:
    - PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^")
    - RELEASE_DESCRIPTION=$(bash scripts/list_changes.sh "$PREV_TAG" "$CI_COMMIT_TAG")
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file target/$X86_64_LINUX/release/${CI_PROJECT_NAME} \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${CI_PROJECT_NAME}-linux-amd64"
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file target/$AARCH64_LINUX/release/${CI_PROJECT_NAME} \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${CI_PROJECT_NAME}-linux-arm64"
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file target/$X86_64_WINDOWS/release/${CI_PROJECT_NAME}.exe \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${CI_PROJECT_NAME}-windows-amd64.exe"
    - |
      ASSET_LINKS=$(jq -n \
        --arg name "$CI_PROJECT_NAME" \
        --arg tag "$CI_COMMIT_TAG" \
        --arg api "$CI_API_V4_URL" \
        --arg pid "$CI_PROJECT_ID" \
        '[
          {"name":($name+"-linux-amd64"),"url":($api+"/projects/"+$pid+"/packages/generic/"+$name+"/"+$tag+"/"+$name+"-linux-amd64"),"link_type":"package"},
          {"name":($name+"-linux-arm64"),"url":($api+"/projects/"+$pid+"/packages/generic/"+$name+"/"+$tag+"/"+$name+"-linux-arm64"),"link_type":"package"},
          {"name":($name+"-windows-amd64.exe"),"url":($api+"/projects/"+$pid+"/packages/generic/"+$name+"/"+$tag+"/"+$name+"-windows-amd64.exe"),"link_type":"package"},
          {"name":"docker-image","url":("https://hub.docker.com/repository/docker/beavuck/"+$name+"/tags?name="+$tag),"link_type":"image"},
          {"name":"crates.io","url":("https://crates.io/crates/beavuck-"+$name+"/"+$tag),"link_type":"package"}
        ]')
      glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" --notes "$RELEASE_DESCRIPTION" --assets-links "$ASSET_LINKS"
